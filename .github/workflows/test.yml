name: C++/Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy

    - name: Build
      run: make all

    - name: Run C++ tests
      run: ./test_range_coder_cpp

    - name: Run Python tests
      run: python3 -m unittest test_range_coder.py

    - name: Run Hello World Examples
      run: make hello
